<div class="page-wrap">
  <div class="title-center">
    <h1 class="main-title">Income Tax Report</h1>
    <h6 class="sub-title">Income Tax Schedule for Salaried Employee</h6>
  </div>

  <div class="it-card">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <section class="section">
      <fieldset class="group">
        <legend>Employee Information</legend>
        <div class="grid">
          <label>Full name
            <input formControlName="name" placeholder="Enter full name" />
            <span class="error" *ngIf="f.name?.invalid && f.name?.touched">Full name is required</span>
          </label>
          <label>Post
            <input formControlName="post" placeholder="Post / Designation" />
            <span class="error" *ngIf="f.post?.invalid && f.post?.touched">Post is required</span>
          </label>
          <label>Department
            <input formControlName="department" placeholder="Employment department" />
            <span class="error" *ngIf="f.department?.invalid && f.department?.touched">Department is required</span>
          </label>
          <label>PAN
            <input formControlName="pan" placeholder="PAN number" />
            <span class="error" *ngIf="f.pan?.invalid && f.pan?.touched">PAN is required</span>
          </label>
          <label>Employer TAN
            <input formControlName="employerTan" placeholder="Employer TAN" />
            <span class="error" *ngIf="f.employerTan?.invalid && f.employerTan?.touched">Employer TAN is required</span>
          </label>
          <label>Treasury Name
            <input formControlName="treasuryName" placeholder="Treasury Name" />
            <span class="error" *ngIf="f.treasuryName?.invalid && f.treasuryName?.touched">Treasury Name is required</span>
          </label>
        </div>
      </fieldset>
    </section>
    <section class="section">
      <fieldset class="group">
        <legend>Salary Details</legend>
        <div class="grid">
          <label>Basic Pay
            <input type="number" formControlName="basicPay" placeholder="Enter basic pay" />
            <span class="error" *ngIf="f.basicPay?.invalid && f.basicPay?.touched">Basic Pay is required (0 allowed)</span>
          </label>
          <label>DA
            <input type="number" formControlName="da" placeholder="Enter DA" />
            <span class="error" *ngIf="f.da?.invalid && f.da?.touched">DA is required</span>
          </label>
          <label>TA
            <input type="number" formControlName="ta" placeholder="Enter TA" />
            <span class="error" *ngIf="f.ta?.invalid && f.ta?.touched">TA is required</span>
          </label>
          <label>DA on Transport Allowance
            <input type="number" formControlName="daOnTransportAllowance" placeholder="Enter DA on transport allowance" />
          </label>
          <label>HRA
            <input type="number" formControlName="hra" placeholder="Enter HRA" />
            <span class="error" *ngIf="f.hra?.invalid && f.hra?.touched">HRA is required</span>
          </label>
          <label>Medical Allowances
            <input type="number" formControlName="medicalAllowances" placeholder="Enter medical allowances" />
            <span class="error" *ngIf="f.medicalAllowances?.invalid && f.medicalAllowances?.touched">Medical Allowances is required (0 allowed)</span>
          </label>

          <label>Special Pay / Bonus / Other Allowances
            <input type="number" formControlName="specialPay" placeholder="Enter special pay" />
          </label>
          <label>Arrear of Dearness Allowance
            <input type="number" formControlName="arrearDearnessAllowance" placeholder="Enter arrear of DA" />
          </label>
          <label>Arrear of Pay and Allowances
            <input type="number" formControlName="arrearPayAndAllowances" placeholder="Enter arrear of pay and allowances" />
          </label>

          <label>Financial Year
            <select formControlName="financialYear">
              <option value="" disabled selected>Please select financial year</option>
              <option *ngFor="let fy of financialYears" [value]="fy">{{ fy }}</option>
            </select>
            <span class="error" *ngIf="f.financialYear?.invalid && f.financialYear?.touched">Please select financial year</span>
          </label>
        </div>
      </fieldset>
    </section>

    <section class="section">
      <fieldset class="group">
        <legend>Income from House Property</legend>
        <div class="grid">
          <label>Income from House Rent
            <input type="number" formControlName="incomeFromHouseRent" placeholder="Enter income from house rent" />
          </label>
          <label>Interest on Housing Loan
            <input type="number" formControlName="interestOnHousingLoan" placeholder="Enter interest on housing loan" />
          </label>
        </div>
      </fieldset>
    </section>

    <section class="section">
      <fieldset class="group">
        <legend>Income from Other Sources</legend>
        <div class="grid">
          <label>Interest on Saving A/c
            <input type="number" formControlName="interestOnSaving" placeholder="Enter interest on saving A/c" />
          </label>
          <label>Interest on Fixed Deposit / Recurring Deposit
            <input type="number" formControlName="interestOnFixedDeposit" placeholder="Enter interest on FD/RD" />
          </label>
          <label>Any other Income
            <input type="number" formControlName="anyOtherIncome" placeholder="Enter any other income" />
          </label>
        </div>
      </fieldset>
    </section>
    <div class="captcha-section">
      <captcha-widget (verified)="onCaptchaVerified($event)"></captcha-widget>
      <div class="error" *ngIf="captchaWarning">{{ captchaWarning }}</div>
    </div>

    <div class="actions">
      <button type="submit" class="primary" [disabled]="saving">{{ saving ? 'Saving...' : 'Save & Generate Report' }}</button>
    </div>
  </form>
  </div>
</div>
